<div style="max-width: 520px; margin: auto; text-align: left;">
  <p>Click tests to add them to the queue (order matters), then press <b>Start battery</b>.</p>
  <div style="margin: 10px 0;">
    <button id="pcc-add-a" type="button">Add Test A</button>
    <button id="pcc-add-b" type="button">Add Test B</button>
    <button id="pcc-clear" type="button">Clear</button>
  </div>
  <div id="pcc-queue-status" style="padding: 8px; border: 1px solid #888; min-height: 1.4em;"></div>
  <div style="margin-top: 14px;">
    <button id="pcc-start" type="button" style="font-weight: bold;">Start battery</button>
  </div>
</div>
