<div [ngSwitch]="currentPage.responseArea?.type">
  <textbox-view *ngSwitchCase="'textboxResponseArea'"></textbox-view>
  <textbox-result-viewer-view *ngSwitchCase="'textboxResponseAreaResultViewer'"></textbox-result-viewer-view>
  <likert-view *ngSwitchCase="'likertResponseArea'"></likert-view>
  <multiple-input-view *ngSwitchCase="'multipleInputResponseArea'"></multiple-input-view>
  <manual-audiometry-view *ngSwitchCase="'manualAudiometryResponseArea'"></manual-audiometry-view>
  <manual-audiometry-result-viewer-view *ngSwitchCase="'manualAudiometryResponseAreaResultViewer'"></manual-audiometry-result-viewer-view>
  <app-multiple-choice-view *ngSwitchCase="'multipleChoiceResponseArea'"></app-multiple-choice-view>
  <custom-response-area-view *ngSwitchCase="'customResponseArea'"></custom-response-area-view>
  <app-calibration-exam *ngSwitchCase="'calibrationResponseArea'"></app-calibration-exam>
  <app-fpl-calibration-exam *ngSwitchCase="'fplCalibrationResponseArea'"></app-fpl-calibration-exam>
  <swept-dpoae-exam *ngSwitchCase="'sweptDPOAEResponseArea'"></swept-dpoae-exam>
  <mrt-exam *ngSwitchCase="'mrtResponseArea'"></mrt-exam>
  <wai-exam *ngSwitchCase="'WAIResponseArea'"></wai-exam>
  <memr-exam *ngSwitchCase="'memrResponseArea'"></memr-exam>
  <app-subject-id *ngSwitchCase="'subjectIdResponseArea'"></app-subject-id>
  <app-checkbox *ngSwitchCase="'checkboxResponseArea'"></app-checkbox>
  <app-button-grid *ngSwitchCase="'buttonGridResponseArea'"></app-button-grid>
  <app-qr-code-response-area *ngSwitchCase="'qrCodeResponseArea'"></app-qr-code-response-area>
</div>
