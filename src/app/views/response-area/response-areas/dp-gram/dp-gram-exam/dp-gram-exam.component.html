<div [ngSwitch]="currentStep">
  <app-input-parameters *ngSwitchCase="'input-parameters'" instruction="Press submit to start the exam." [parameterMap]="inputParameterMap">
  </app-input-parameters>
  <app-dp-gram-in-progress
    *ngSwitchCase="'in-progress'"
    [device]="device"
    [xScale]="xScale"
    [yScale]="yScale"
    [width]="width"
    [height]="height"
    [xTicks]="xTicks"
    [margin]="margin"
    (resultsEvent)="saveResults($event)">
  </app-dp-gram-in-progress>

  <app-dp-gram-results
    *ngSwitchCase="'results'"
    [xScale]="xScale"
    [width]="width"
    [height]="height"
    [xTicks]="xTicks"
    [margin]="margin"
    [results]="examResults"
    [normativeData]="normativeData">
  </app-dp-gram-results>
</div>
