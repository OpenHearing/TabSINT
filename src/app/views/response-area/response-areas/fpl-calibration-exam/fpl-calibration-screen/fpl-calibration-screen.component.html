<p class="instructions">
  <span> 
    Press Start Calibration to begin FPL calibration for {{ outputChannel }}
  </span>
</p>

<div class="calibration-box">
  <div class="button-container">
    <button class="adjust-button" (click)="calibrate()">Start Calibration</button>
    
  </div>
  <div>
    WAI EXAM RUNNING INDICATOR
  </div>
  <div class="button-container">
    <button class="adjust-button" (click)="abort()">Abort Calibration</button>
  </div>
  
</div>
