<div [ngSwitch]="currentStep">
  <p class="instructions">{{ instructions }}</p>

  <input-parameters *ngSwitchCase="'Ready'" [instructions]="instructions" [parameterMap]="inputParameterMap">
  </input-parameters>

  <div *ngSwitchCase="'Exam'">
    <div class="fixed-footer">
      <div class="row pad-top">
        <div class="col-6 justify-content-center text-center">
          {{ 'Blocks Complete' | translate }}
        </div>
        <div class="col-6 justify-content-center">
          <button class="btn btn-default btn-disabled">
            {{ blocksComplete }}
          </button>
        </div>
      </div>
      <div class="row pad-top">
        <div class="col-12">
          <mat-progress-bar class="progress-bar" mode="determinate" [value]="pctComplete"></mat-progress-bar>
          <button class="btn btn-danger btn-block" [disabled]="state.isSubmittable" (click)="showCancelExamDialog()">
            {{ 'Abort' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
