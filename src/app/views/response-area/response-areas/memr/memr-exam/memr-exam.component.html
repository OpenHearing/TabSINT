<div [ngSwitch]="currentStep">
  <p class="instructions">{{ instructions }}</p>

  <input-parameters *ngSwitchCase="'Ready'" [parameterMap]="inputParameterMap">
  </input-parameters>

  <div *ngSwitchCase="'Finish'">

    <div *ngIf="memrResults && getRecordChannelsArray().length > 0" class="results-container">
      <table class="results-table">
        <thead>
          <tr>
            <th>Channel</th>
            <th>Average Leq (dB SPL)</th>
            <th>Peak Leq (dB SPL)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let channel of getRecordChannelsArray(); let i = index">
            <td>{{ channel }}</td>
            <td>{{ getRecordedLevelLeq(i) }}</td>
            <td>{{ getRecordedLevelPeak(i) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngSwitchCase="'Exam'">

    <div *ngIf="memrResults && getRecordChannelsArray().length > 0" class="results-container">
      <table class="results-table">
        <thead>
          <tr>
            <th>Channel</th>
            <th>Average Leq (dB SPL)</th>
            <th>Peak Leq (dB SPL)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let channel of getRecordChannelsArray(); let i = index">
            <td>{{ channel }}</td>
            <td>{{ getRecordedLevelLeq(i) }}</td>
            <td>{{ getRecordedLevelPeak(i) }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="row pad-top">
      <div class="col-6 justify-content-center text-center">
        {{ 'Blocks Complete' | translate }}
      </div>
      <div class="col-6 justify-content-center">
        <button class="btn btn-default btn-disabled">
          {{ blocksComplete }}
        </button>
      </div>
    </div>

    <div class="row pad-top progress-container">
      <div class="col-12 progress-column">
        <mat-progress-bar class="progress-bar" mode="determinate" [value]="pctComplete"></mat-progress-bar>
        <button class="btn btn-danger btn-block" [disabled]="state.isSubmittable" (click)="showCancelExamDialog()">
          {{ 'Abort' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
