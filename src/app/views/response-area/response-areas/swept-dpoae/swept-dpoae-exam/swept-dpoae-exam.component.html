<div [ngSwitch]="currentStep">
  <app-input-parameters *ngSwitchCase="'input-parameters'" instruction="Press submit to start the exam." [parameterMap]="inputParameterMap">
  </app-input-parameters>
  <app-swept-dpoae-in-progress
    *ngSwitchCase="'in-progress'"
    [f2Start]="f2Start"
    [f2End]="f2End"
    [device]="device"
    [xScale]="xScale"
    [yScale]="yScale"
    [width]="width"
    [height]="height"
    [xTicks]="xTicks"
    [margin]="margin"
    (sweptDPOAEResultsEvent)="saveResults($event)">
  </app-swept-dpoae-in-progress>

  <app-swept-dpoae-results
    *ngSwitchCase="'results'"
    [f2Start]="f2Start"
    [f2End]="f2End"
    [xScale]="xScale"
    [width]="width"
    [height]="height"
    [xTicks]="xTicks"
    [margin]="margin"
    [sweptDPOAEResults]="sweptDPOAEResults"
    [normativeData]="normativeData">
  </app-swept-dpoae-results>
</div>
