<div style="width: 100%">
  <div *ngFor="let row of rows" class="button-grid">
    <div
      *ngFor="let choice of row.choices"
      [ngStyle]="{ 'padding-bottom': paddingBottom, 'padding-left': paddingLeft, 'padding-right': paddingRight }">
      <button
        [class]="buttonGridBtnClass(choice)"
        [ngStyle]="{
          'font-size': choice.fontSize,
          background: choice.backgroundColor || (choice.disable && '#cccccc'),
          color: choice.textColor || (choice.disable && '#666666'),
        }"
        (click)="choiceSelected(choice.id)">
        {{ choice.text }}
      </button>
    </div>
  </div>
</div>
