<p class="instructions">{{ instruction }}</p>

<div class="input-parameters-container">
  <table class="input-parameters-table">
    <thead>
      <tr>
        <th>{{ "Parameter" | transloco }}</th>
        <th>{{ "Value" | transloco }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let parameter of parameterMap | keyvalue: originalOrder">
        <td>{{ parameter.key }}</td>
        <td>{{ parameter.value }}</td>
      </tr>
    </tbody>
  </table>
</div>
