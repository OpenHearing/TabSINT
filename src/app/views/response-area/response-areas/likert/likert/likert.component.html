<div class="likert-container" *ngFor="let question of questions; let questionIndex = index">
  <!-- Question Text (may contain HTML) -->
  <p class="question" [style.font-size]="question.questionFontSize" [innerHTML]="question.safeText"></p>

  <!-- Center Label Above -->
  <p *ngIf="question.centerLabelAbove" class="likert-center-label" [style.font-size]="question.labelFontSize">
    {{ question.centerLabelAbove }}
  </p>

  <!-- Labels Above -->
  <div class="likert-labels" *ngIf="hasLabels(question.topLabels)" [style.font-size]="question.labelFontSize">
    <span *ngFor="let label of question.topLabels" class="likert-label">{{ label }}</span>
  </div>

  <!-- Slider Mode -->
  <div *ngIf="useSlider" class="likert-slider-container">
    <!-- Ruler -->
    <div class="ruler">
      <div
        class="tick"
        *ngFor="let value of [].constructor(question.levels * 10 + 1); let index = index"
        [ngClass]="{
          'major-tick': index % 10 === 0,
          'minor-tick': index % 10 !== 0,
        }"
        [style.left]="((index / 10) * 100) / question.levels + '%'">
        <!-- Major Tick Buttons -->
        <button
          *ngIf="index % 10 === 0"
          class="tick-button"
          (click)="setSliderValue(questionIndex, index / 10)"
          [style.left]="((index / 10) * 100) / question.levels + '%'">
          {{ index / 10 }}
        </button>
      </div>
    </div>

    <!-- Slider Input -->
    <input
      type="range"
      [class.hidden-cursor]="isNotApplicable[questionIndex] || sliderValue[questionIndex] === null"
      min="0"
      [max]="question.levels"
      step="0.1"
      class="custom-slider"
      [value]="sliderValue[questionIndex]"
      (input)="onSliderChange(questionIndex, $event)" />
  </div>

  <!-- Button Mode -->
  <div *ngIf="!useSlider" class="likert-scale">
    <div class="likert-options">
      <button
        *ngFor="let level of [].constructor(question.levels); let levelIndex = index"
        class="likert-option"
        [ngClass]="{ selected: results.currentPage.response[questionIndex] === levelIndex }"
        (click)="onResponseChange(questionIndex, levelIndex)">
        <span *ngIf="question.useEmoticons">{{ emoticons[levelIndex % emoticons.length] }}</span>
        <span *ngIf="!question.useEmoticons && useRadioButtons" class="radio-circle"></span>
        <span *ngIf="!question.useEmoticons && !useRadioButtons">{{ levelIndex }}</span>
      </button>
    </div>
  </div>

  <!-- Labels Below -->
  <div class="likert-labels" *ngIf="hasLabels(question.bottomLabels)" [style.font-size]="question.labelFontSize">
    <span *ngFor="let label of question.bottomLabels" class="likert-label">{{ label }}</span>
  </div>

  <!-- Center Label Below -->
  <p *ngIf="question.centerLabelBelow" class="likert-center-label" [style.font-size]="question.labelFontSize">
    {{ question.centerLabelBelow }}
  </p>

  <!-- Not Applicable Checkbox -->
  <div *ngIf="naBox" class="likert-footer">
    <label>
      <input type="checkbox" [(ngModel)]="isNotApplicable[questionIndex]" (change)="onNotApplicableChange(questionIndex, $event)" />
      Not Applicable
    </label>
  </div>
</div>
