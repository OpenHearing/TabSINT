<h2 mat-dialog-title>{{ title | transloco }}</h2>

<mat-dialog-content>
  <div>{{ description | transloco }}</div>
  <mat-radio-group aria-label="Select Gitlab Reference" [(ngModel)]="selectedOption">
    <mat-radio-button [value]="optionTag">{{ "Latest Tag" | transloco }}</mat-radio-button>
    <mat-radio-button [value]="optionCommit">{{ "Latest Commit" | transloco }}</mat-radio-button>
  </mat-radio-group>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="cancel()">{{ "Cancel" | transloco }}</button>
  <button mat-button class="focused-appearance" (click)="confirm()">{{ "OK" | transloco }}</button>
</mat-dialog-actions>
