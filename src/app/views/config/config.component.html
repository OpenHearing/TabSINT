<div id="config">
  <mat-expansion-panel class="panel panel-default" [(expanded)]="state.isPaneOpen.general">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ "TabSINT" | transloco }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="panel-body text-left">
      <app-tabsint-config-view></app-tabsint-config-view>
    </div>
  </mat-expansion-panel>

  <br />

  <!-- Software and Hardware Status -->
  <mat-expansion-panel class="panel panel-default" [(expanded)]="state.isPaneOpen.softwareHardware">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ "Software and Hardware" | transloco }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="panel-body text-left">
      <app-software-config-view></app-software-config-view>
    </div>
  </mat-expansion-panel>

  <br />

  <!-- Log view -->
  <mat-expansion-panel class="panel panel-default" [(expanded)]="state.isPaneOpen.appLog">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ "Application Log" | transloco }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="panel-body text-left">
      <app-log-config-view></app-log-config-view>
    </div>
  </mat-expansion-panel>
</div>
