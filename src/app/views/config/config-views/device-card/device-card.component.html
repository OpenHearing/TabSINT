<div class="device-card">

  <div class="device-card-header">
    <div>
      <span class="admin-labels">{{ "Device Name:" | transloco }}</span>
      <em>{{ device.name }}</em>
    </div>
    <div>
      <span class="admin-labels">{{ "TabSINT ID:" | transloco }}</span>
      <em>{{ device.tabsintId }}</em>
    </div>
  </div>

  <div class="pad-top">
    <span class="admin-labels">{{ "State:" | transloco }}</span>
    <em *ngIf="device.state === DeviceState.Connected"> {{ "Connected" | transloco }}</em>
    <em *ngIf="device.state === DeviceState.Disconnected"> {{ "Not Connected" | transloco }}</em>
    <em *ngIf="device.state !== DeviceState.Connected && device.state !== DeviceState.Disconnected"> {{ "Connecting..." | transloco }}</em>
  </div>

  <div class="device-card-actions">
    <div [ngSwitch]="device.state">
      <button *ngSwitchDefault class="btn btn-primary btn-block" (click)="disconnect()">{{ "Cancel" | transloco }}</button>
      <button
        *ngSwitchCase="DeviceState.Disconnected"
        class="btn btn-primary btn-block"
        [disabled]="!bluetoothConnected"
        [ngClass]="!bluetoothConnected ? 'disabled custom-disabled' : ''"
        (click)="reconnect()">
        {{ "Connect" | transloco }}
      </button>
      <button *ngSwitchCase="DeviceState.Connected" class="btn btn-primary btn-block" (click)="disconnect()">{{ "Disconnect" | transloco }}</button>
    </div>
    <button class="btn btn-primary btn-block" (click)="remove()">{{ "Remove" | transloco }}</button>
  </div>

  <button
    class="device-card-settings-toggle"
    (click)="toggleSettings()"
    [attr.aria-expanded]="settingsExpanded">
    <i [class]="settingsExpanded ? 'ion-chevron-up' : 'ion-chevron-down'"></i>
    <span>{{ "Settings" | transloco }}</span>
  </button>

  <div [ngbCollapse]="!settingsExpanded">
    <app-device-info-view [device]="device"></app-device-info-view>
  </div>

</div>
