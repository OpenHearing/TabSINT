<div mat-accordion multi>
  <mat-expansion-panel class="panel panel-default" [(expanded)]="state.isPaneOpen.protocols">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ "Protocols" | transloco }}</mat-panel-title>
    </mat-expansion-panel-header>

    <div class="panel-body text-left">
      <!-- <div *ngIf="devices.diskM.diskMSpace < 200" i18n>
        <span class="glyphicon glyphicon-exclamation-sign warn-red"></span>
        The device has less than 200 MB of diskM.diskM space left. Please make more diskM.diskM space available before adding more protocols.
      </div> -->

      <table class="table fixed">
        <thead>
          <tr>
            <th scope="col" class="row-Name">{{ "Name" | transloco }}</th>
            <th scope="col" class="row-Server">{{ "Source" | transloco }}</th>
            <th scope="col" class="row-Version">{{ "Version" | transloco }}</th>
            <th scope="col" class="row-Date">{{ "Date" | transloco }}</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let p of getAvailableProtocols(); trackBy: trackByIndex; let i = index"
            class="no-border"
            (click)="select(p.value)"
            (keypress)="select(p.value)">
            <td [ngClass]="pclass(p.value)" class="row-Name">{{ p.value.name }}</td>
            <td [ngClass]="pclass(p.value)" class="row-Name">{{ p.value.server }}</td>
            <td [ngClass]="pclass(p.value)" class="row-Version">{{ p.value.version }}</td>
            <td [ngClass]="pclass(p.value)" class="row-Date">{{ p.value.date }}</td>
          </tr>
        </tbody>
      </table>

      <br />

      <div class="row pad-top">
        <div class="col-6">
          <label for="validateProtocols">{{ "Validate protocols:" | transloco }}</label>
        </div>
        <div class="col-2">
          <input id="validateProtocols" type="checkbox" [ngModel]="disk.preferences.validateProtocols" (change)="toggleValidateProtocols()" />
        </div>
        <div class="col-2"></div>
        <div class="col-1">
          <i [matMenuTriggerFor]="validateProtocolMenu" class="ion-help-circled"></i>
        </div>
        <mat-menu #validateProtocolMenu="matMenu">
          <button mat-menu-item>
            <div [innerHTML]="validateProtocolPopover"></div>
          </button>
        </mat-menu>
      </div>

      <div class="row pad-top">
        <div class="col-4">
          <button [disabled]="isButtonDisabled()" *ngIf="!isProtocolActive()" class="btn btn-primary btn-block" (click)="loadProtocol()">
            <i class="ion-compose"></i> {{ "Load" | transloco }}
          </button>
          <button [disabled]="isButtonDisabled()" *ngIf="isProtocolActive()" class="btn btn-default btn-block" (click)="loadProtocol()">
            <i class="ion-refresh"></i> {{ "Reload" | transloco }}
          </button>
        </div>
        <div class="col-4">
          <button *ngIf="showUpdateButton()" [disabled]="isButtonDisabled()" class="btn btn-success btn-block" (click)="update()">
            <i class="ion-android-sync"></i> Update
          </button>
        </div>
        <div class="col-4">
          <button *ngIf="showDeleteButton()" [disabled]="isButtonDisabled()" class="btn btn-danger btn-block" (click)="delete()" i18n>
            <i class="ion-trash-a"></i> Delete
          </button>
        </div>
      </div>
    </div>
  </mat-expansion-panel>

  <mat-expansion-panel class="protocol-source" class="panel panel-default" [(expanded)]="state.isPaneOpen.protocolsSource">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ "Source" | transloco }}</mat-panel-title>
    </mat-expansion-panel-header>

    <div class="panel-body text-left">
      <div class="row pad-top align-items-center">
        <div class="col-3 admin-labels">{{ "Server:" | transloco }}</div>
        <div class="col-6">
          <div class="row">
            <div class="col-6">
              <button class="btn btn-primary w-100" [ngClass]="{ active: selectedSource === 'gitlab' }" (click)="setSource('gitlab')">
                {{ "Gitlab" | transloco }}
              </button>
            </div>
            <div class="col-6">
              <button class="btn btn-primary w-100" [ngClass]="{ active: selectedSource === 'device' }" (click)="setSource('device')">
                {{ "Device Storage" | transloco }}
              </button>
            </div>
          </div>
        </div>
        <div class="col-1"></div>
        <div class="col-1">
          <i [matMenuTriggerFor]="protocolServerMenu" class="ion-help-circled"></i>
        </div>
        <mat-menu #protocolServerMenu="matMenu">
          <button mat-menu-item>
            <div [innerHTML]="protocolServerPopover"></div>
          </button>
        </mat-menu>
      </div>

      <div *ngIf="selectedSource === 'gitlab'" class="gitlab-config">
        <div class="row pad-top">
          <div class="col-3">
            <label for="repository">{{ "Repository:" | transloco }}</label>
          </div>
          <div class="col-6">
            <input
              id="repository"
              type="text"
              class="form-control"
              placeholder="Name"
              (input)="onGitlabConfigChange($event, 'repository')"
              [(ngModel)]="gitlabConfig.repository" />
          </div>
          <div class="col-1">
            <i [matMenuTriggerFor]="repositoryHelpMenu" class="ion-help-circled"></i>
          </div>
          <mat-menu #repositoryHelpMenu="matMenu">
            <button mat-menu-item>
              <div [innerHTML]="gitlabAddPopover"></div>
            </button>
          </mat-menu>
        </div>
        <div class="row pad-top">
          <div class="col-3">
            <label for="tag">{{ "Tag:" | transloco }}</label>
          </div>
          <div class="col-6">
            <input
              id="version"
              type="text"
              class="form-control"
              placeholder="Latest"
              (input)="onGitlabConfigChange($event, 'tag')"
              [(ngModel)]="gitlabConfig.tag" />
          </div>
          <div class="col-1">
            <i [matMenuTriggerFor]="versionHelpMenu" class="ion-help-circled"></i>
          </div>
          <mat-menu #versionHelpMenu="matMenu">
            <button mat-menu-item>
              <div [innerHTML]="gitlabAddVersionPopover"></div>
            </button>
          </mat-menu>
        </div>
        <div class="row pad-top">
          <div class="col-3">
            <label for="host">{{ "Host:" | transloco }}</label>
          </div>
          <div class="col-6">
            <input
              id="host"
              type="text"
              class="form-control"
              placeholder="https://gitlab.com/"
              (input)="onGitlabConfigChange($event, 'host')"
              [(ngModel)]="gitlabConfig.host" />
          </div>
          <div class="col-1">
            <i [matMenuTriggerFor]="hostHelpMenu" class="ion-help-circled"></i>
          </div>
          <mat-menu #hostHelpMenu="matMenu">
            <button mat-menu-item>
              <div [innerHTML]="gitlabHostPopover"></div>
            </button>
          </mat-menu>
        </div>
        <div class="row pad-top">
          <div class="col-3">
            <label for="token">{{ "Token:" | transloco }}</label>
          </div>
          <div class="col-6">
            <input
              id="token"
              type="text"
              class="form-control"
              placeholder="Token"
              (input)="onGitlabConfigChange($event, 'token')"
              [(ngModel)]="gitlabConfig.token" />
          </div>
          <div class="col-1">
            <i [matMenuTriggerFor]="tokenHelpMenu" class="ion-help-circled"></i>
          </div>
          <mat-menu #tokenHelpMenu="matMenu">
            <button mat-menu-item>
              <div [innerHTML]="gitlabTokenPopover"></div>
            </button>
          </mat-menu>
        </div>
        <div class="row pad-top">
          <div class="col-3">
            <label for="group">{{ "Group:" | transloco }}</label>
          </div>
          <div class="col-6">
            <input
              id="group"
              type="text"
              class="form-control"
              placeholder="Group"
              (input)="onGitlabConfigChange($event, 'group')"
              [(ngModel)]="gitlabConfig.group" />
          </div>
          <div class="col-1">
            <i [matMenuTriggerFor]="groupHelpMenu" class="ion-help-circled"></i>
          </div>
          <mat-menu #groupHelpMenu="matMenu">
            <button mat-menu-item>
              <div [innerHTML]="gitlabNamespacePopover"></div>
            </button>
          </mat-menu>
        </div>
        <div class="row pad-top">
          <div class="col-5">
            <button class="btn btn-default btn-block" (click)="fetchGitlabProtocol()"><i class="ion-plus-round"></i> {{ "Add" | transloco }}</button>
          </div>
        </div>
      </div>

      <div *ngIf="selectedSource === 'device'">
        <div class="row pad-top">
          <div class="col-3">
            <label for="directory">{{ "Directory:" | transloco }}</label>
          </div>
          <div class="col-4">
            <button class="btn btn-default btn-block" (click)="addProtocols()"><i class="ion-plus-round"></i> {{ "Add" | transloco }}</button>
          </div>
        </div>
      </div>
