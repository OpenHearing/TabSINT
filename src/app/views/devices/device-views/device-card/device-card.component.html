<div class="device-card">

  <div class="device-card-header">
    <div>
      <span class="admin-labels">Device Name:</span>
      <em>{{ device.name }}</em>
    </div>
    <div>
      <span class="admin-labels">State:</span>
      <em *ngIf="device.state === DeviceState.Connected"> Connected</em>
      <em *ngIf="device.state === DeviceState.Disconnected"> Not Connected</em>
      <em *ngIf="device.state !== DeviceState.Connected && device.state !== DeviceState.Disconnected"> Connecting...</em>
    </div>
  </div>

  <div class="row pad-top">
    <div class="col-6">
      <div [ngSwitch]="device.state">
        <button *ngSwitchDefault class="btn btn-block btn-primary" (click)="disconnect()" style="display:flex;align-items:center;justify-content:center;">Cancel</button>
        <button
          *ngSwitchCase="DeviceState.Disconnected"
          class="btn btn-block btn-primary"
          [disabled]="!connected"
          [ngClass]="!connected ? 'disabled custom-disabled' : ''"
          (click)="reconnect()"
          style="display:flex;align-items:center;justify-content:center;">
          Connect
        </button>
        <button *ngSwitchCase="DeviceState.Connected" class="btn btn-block btn-primary" (click)="disconnect()" style="display:flex;align-items:center;justify-content:center;">Disconnect</button>
      </div>
    </div>
    <div class="col-6">
      <button class="btn btn-block btn-primary" (click)="remove()" style="display:flex;align-items:center;justify-content: center;">Remove</button>
    </div>
  </div>

  <button
    *ngIf="device.state === DeviceState.Connected"
    class="device-card-settings-toggle"
    (click)="toggleSettings()"
    [attr.aria-expanded]="settingsExpanded">
    <i [class]="settingsExpanded ? 'ion-chevron-up' : 'ion-chevron-down'"></i>
    <span>Settings</span>
  </button>

  <div [ngbCollapse]="!settingsExpanded">
    <ng-content></ng-content>
  </div>

</div>
