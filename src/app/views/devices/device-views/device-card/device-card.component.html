<div class="device-card">
  <div class="device-card-header">
    <div>
      <span class="admin-labels">{{ "Device Name:" | transloco }}</span>
      <em>{{ device.name }}</em>
    </div>
    <div>
      <span class="admin-labels">{{ "State:" | transloco }}</span>
      <em>{{ stateLabel | transloco }}</em>
    </div>
  </div>

  <div class="row pad-top">
    <div class="col-6">
      <div [ngSwitch]="device.state">
        <button
          *ngSwitchDefault
          class="btn btn-block btn-primary"
          [disabled]="isTransitioning"
          [class.disabled]="isTransitioning"
          [class.custom-disabled]="isTransitioning"
          (click)="disconnect()"
          style="display: flex; align-items: center; justify-content: center">
          {{ "Cancel" | transloco }}
        </button>
        <button
          *ngSwitchCase="DeviceState.Disconnected"
          class="btn btn-block btn-primary"
          [disabled]="connectDisabled"
          [class.disabled]="connectDisabled"
          [class.custom-disabled]="connectDisabled"
          (click)="reconnect()"
          style="display: flex; align-items: center; justify-content: center">
          {{ "Connect" | transloco }}
        </button>
        <button
          *ngSwitchCase="DeviceState.Connected"
          class="btn btn-block btn-primary"
          [disabled]="isTransitioning"
          [class.disabled]="isTransitioning"
          [class.custom-disabled]="isTransitioning"
          (click)="disconnect()"
          style="display: flex; align-items: center; justify-content: center">
          {{ "Disconnect" | transloco }}
        </button>
      </div>
    </div>
    <div class="col-6">
      <button
        class="btn btn-block btn-primary"
        [disabled]="isTransitioning"
        [class.disabled]="isTransitioning"
        [class.custom-disabled]="isTransitioning"
        (click)="remove()"
        style="display: flex; align-items: center; justify-content: center">
        {{ "Remove" | transloco }}
      </button>
    </div>
  </div>

  <button
    *ngIf="enabled && device.state === DeviceState.Connected && device.type !== DeviceType.Svantek"
    class="device-card-settings-toggle"
    (click)="toggleSettings()"
    [attr.aria-expanded]="settingsExpanded">
    <i [class]="settingsExpanded ? 'ion-chevron-up' : 'ion-chevron-down'"></i>
    <span>{{ "Settings" | transloco }}</span>
  </button>

  <div [ngbCollapse]="!enabled || !settingsExpanded || device.state !== DeviceState.Connected || device.type === DeviceType.Svantek">
    <ng-content></ng-content>
  </div>
</div>
