sonar.projectKey=Open-Hearing-TabSINT
sonar.qualitygate.wait=true
sonar.sources=src/
sonar.tests=src/
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts
sonar.coverage.exclusions=**/src/app/views/**

# Specify the coverage report path
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Suppress Dockerfile findings that are intentional for this CI build image:
#   S6471 - base image runs as root (required for apt/sdkmanager in the build image)
#   S7031 - separate RUN layers kept on purpose (secret-mount isolation + build caching)
#   S6470 - recursive COPY of the project into the build image is intended
# Suppress table findings for the three-digit keypad, which is a layout table by design:
#   S5256 - <th> headers do not apply to a numeric keypad
#   S5257 - the <table> is intentionally used for keypad layout
sonar.issue.ignore.multicriteria=dockerRoot,dockerRun,dockerCopy,threeDigitHeaders,threeDigitLayout
sonar.issue.ignore.multicriteria.dockerRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.dockerRoot.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.dockerRun.ruleKey=docker:S7031
sonar.issue.ignore.multicriteria.dockerRun.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.dockerCopy.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.dockerCopy.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.threeDigitHeaders.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.threeDigitHeaders.resourceKey=**/three-digit.component.html
sonar.issue.ignore.multicriteria.threeDigitLayout.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.threeDigitLayout.resourceKey=**/three-digit.component.html

# Specify SonarQube server details (if using local SonarQube)
# sonar.host.url=http://localhost:9000
# sonar.login=val@creare.com  # Replace with a token or your SonarQube username