spec:
  inputs:
    svn_tag:
      description: "Provide the SVN tag. The default empty string will use the latest available tag."
      default: ""
---
image:
  name: sonarsource/sonar-scanner-cli:latest
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG_BASE: $CI_REGISTRY_IMAGE
  SVN_TAG: $[[ inputs.svn_tag ]]

stages:
  - linters
  - build-docker-image
  - test
  - sonarqube-check
  - beta-release
  - release
  - cleanup

build-docker-image:
  stage: build-docker-image
  image: docker:cli
  services:
    - docker:dind
  tags:
    - docker
    - shell
    - privileged
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - SAFE_COMMIT_REF_NAME=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_TAG_BASE:$SAFE_COMMIT_REF_NAME"
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

hadolint_check:
  stage: linters
  # The default dockerfile linter image is just hadolint/hadolint, but this version also
  # has a shell installed, which gitlab CI needs to work.  See:
  # https://github.com/hadolint/hadolint?tab=readme-ov-file#how-to-use
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint Dockerfile
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

test:
  stage: test
  image: docker:cli
  services:
    - docker:dind
  tags:
    - docker
    - privileged
  dependencies:
    - build-docker-image
  script:
    - SAFE_COMMIT_REF_NAME=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_TAG_BASE:$SAFE_COMMIT_REF_NAME"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - mkdir -p coverage
    - CONTAINER_ID=$(docker run -d $IMAGE_TAG npm run test:headless)
    - docker wait $CONTAINER_ID
    - docker cp $CONTAINER_ID:/usr/src/app/coverage/lcov.info ./coverage/lcov.info
    - docker stop $CONTAINER_ID
    - docker rm $CONTAINER_ID
  artifacts:
    paths:
      - coverage/lcov.info
    untracked: false
    when: on_success
    access: all
    expire_in: "1 days"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

sonarqube-check:
  stage: sonarqube-check
  cache:
    policy: pull
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - sonar-scanner/
  dependencies:
    - test
  script:
    - ls coverage/
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-beta-release-apk:
  stage: beta-release
  image: docker:cli
  services:
    - docker:dind
  tags:
    - docker
    - privileged
  dependencies:
    - build-docker-image
  script:
    - SAFE_COMMIT_REF_NAME=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_TAG_BASE:$SAFE_COMMIT_REF_NAME"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - mkdir -p android
    - CONTAINER_ID=$(docker run -d $IMAGE_TAG npm run run.build.beta:ci)
    - docker wait $CONTAINER_ID
    - docker cp $CONTAINER_ID:/usr/src/app/android/app/build/outputs/apk/debug/app-debug.apk ./android/app/
    - docker stop $CONTAINER_ID
    - docker rm $CONTAINER_ID
  artifacts:
    paths:
      - android/app/app-debug.apk
    expire_in: 2 days
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-release-apk-aab:
  stage: release
  image: docker:cli
  services:
    - docker:dind
  tags:
    - docker
    - privileged
  dependencies:
    - build-docker-image
  script:
    - SAFE_COMMIT_REF_NAME=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_TAG_BASE:$SAFE_COMMIT_REF_NAME"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - |
      CONTAINER_ID=$(docker run -d \
        -e ANDROID_KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64" \
        -e ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
        -e ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
        -e ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
        -e ANDROID_KEYSTORE_PATH="/tmp/release.keystore" \
        "$IMAGE_TAG" sh -c "
          echo \$ANDROID_KEYSTORE_BASE64 | base64 -d > /tmp/release.keystore &&
          npm run run.build.production:ci
        ")
    - docker wait $CONTAINER_ID
    - docker cp $CONTAINER_ID:/usr/src/app/android/app/build/outputs/apk/release/app-release.apk ./android/app/
    - docker cp $CONTAINER_ID:/usr/src/app/android/app/build/outputs/bundle/release/app-release.aab ./android/app/
    - docker stop $CONTAINER_ID
    - docker rm $CONTAINER_ID
  artifacts:
    paths:
      - android/app/app-release.apk
      - android/app/app-release.aab
    expire_in: 2 days
  rules:
    - if: $CI_COMMIT_TAG

archive-release-apk-aab:
  stage: release
  image: alpine:latest
  needs:
    - job: build-release-apk-aab
      artifacts: true
  before_script:
    - apk add --no-cache curl zip
  script:
    - mkdir -p dist
    - cp android/app/app-release.apk dist/app-release.apk
    - cp android/app/app-release.aab dist/app-release.aab
    - cd dist
    - zip -r app-release.zip .
    - cd ..
    - |
      curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file dist/app-release.zip \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/android/${CI_COMMIT_TAG}/app-release.zip"
  artifacts:
    paths:
      - dist/app-release.zip
    expire_in: 2 days
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

release:
  stage: release
  image: alpine:latest
  needs:
    - job: archive-release-apk-aab
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
    - |
      curl --fail \
        --request POST \
        --header "PRIVATE-TOKEN: $CI_RELEASE_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"Release $CI_COMMIT_TAG\",
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"description\": \"Android release for $CI_COMMIT_TAG\",
          \"assets\": {
            \"links\": [
              {
                \"name\": \"app-release.zip\",
                \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/app-release.zip\",
                \"link_type\": \"package\"
              }
            ]
          }
        }" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - echo "Creating GitHub release for $CI_COMMIT_TAG"
    - echo "Waiting for tag $CI_COMMIT_TAG to exist on GitHub..."
    - |
      for i in $(seq 1 10); do
        if curl --silent --fail \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/OpenHearing/TabSINT/git/ref/tags/$CI_COMMIT_TAG" \
          >/dev/null; then
          echo "Tag found."
          break
        fi
        if [ "$i" -eq 10 ]; then
          echo "Timed out waiting for tag."
          exit 1
        fi
        echo "Tag not available yet. Waiting 30 seconds..."
        sleep 30
      done
    - echo "Publishing Release for GitHub"
    - |
      RELEASE_JSON=$(curl --silent --fail \
          -X POST \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "Accept: application/vnd.github+json" \
          --data "{
            \"name\": \"Release $CI_COMMIT_TAG\",
            \"tag_name\": \"$CI_COMMIT_TAG\",
            \"generate_release_notes\": true
          }" \
          "https://api.github.com/repos/OpenHearing/TabSINT/releases")
      UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{?name,label}//')
      curl --fail \
        -X POST \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Content-Type: application/zip" \
        --data-binary @dist/app-release.zip \
        "${UPLOAD_URL}?name=app-release.zip"
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

cleanup:
  stage: cleanup
  script:
    - rm -f ./android/app/app-debug.apk
  rules:
    - if: $CI_JOB_MANUAL
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
